name: APK build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: APK fordítása
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK átnevezése
        run: cp app/build/outputs/apk/debug/app-debug.apk HydroFren.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HydroFren-apk
          path: HydroFren.apk

      - name: Kiadás a telefonos letöltéshez
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HydroFren 2.0.${{ github.run_number }}
          files: HydroFren.apk
          make_latest: true
